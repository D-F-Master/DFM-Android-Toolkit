  <text x="56" y="154" font-size="13" fill="#334155">plugin.json 入口 + preload 注入 window.services</text>

  <text x="576" y="214" font-size="12" fill="#64748b">update-server :8080（latest.yml + 安装包，electron-updater）</text>

  <text x="436" y="526" font-size="12.5" fill="#334155">pipeline　生产流水线（素材库/快照/run-script/增量日志）</text>
  <text x="436" y="546" font-size="12.5" fill="#334155">probe　探针对接（check / connect / message）</text>

  <text x="366" y="768" font-size="12.5" fill="#334155">批量投屏 DeviceSession 双 TCP</text>

  <text x="56" y="902" font-size="13" fill="#334155">设备管理 · 应用管理 · 文件浏览/上传下载 · 按键模拟</text>
  <text x="56" y="922" font-size="13" fill="#334155">日志查看 · SQLite 拉取与回推 · 模拟脚本回放 · 模拟串口</text>
  <text x="56" y="942" font-size="13" fill="#334155">生产流水线批量 run-script · 批量投屏（H.264 → /ws/remote）</text>
  <text x="56" y="962" font-size="12" fill="#64748b">串口透传会话需 root，经探针 stty + 节点读写完成</text>

  <rect x="700" y="850" width="820" height="130" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="716" y="878" font-size="16" font-weight="bold" fill="#701a75">DFM-probe APK — 无界面常驻探针（TCP 0.0.0.0:21104）</text>
  <text x="716" y="902" font-size="13" fill="#334155">ProbeService 前台服务 · 每连接单线程 · 增量解帧 / CRC / 粘包</text>
  <text x="716" y="922" font-size="13" fill="#334155">AA 55 帧：帧序 1B · 长度 2B · 命令字 1B · JSON 数据区 · CRC16-Modbus · ACK(0x06) 停等重传 200ms×3</text>
  <text x="716" y="942" font-size="13" fill="#334155">命令：0x00 心跳 · 0x01 TTS 朗读 · 0x02 设备详细信息 · 0x03/04/05/07 串口会话</text>
  <text x="716" y="962" font-size="12" fill="#64748b">开机自启 + 60s 看门狗 + START_STICKY 保活 · adb 仅负责安装/广播/forward，不承载业务数据</text>
